name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit -p tsconfig.app.json

      - run: npm run test:unit

      - run: npm run build

      - name: Verify PWA output (offline shell)
        run: |
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          grep -q precacheAndRoute dist/sw.js
          test ! -f dist/index.html || ! grep -q gpteng dist/index.html

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install sync server dependencies
        working-directory: server
        run: npm ci

      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npm test
